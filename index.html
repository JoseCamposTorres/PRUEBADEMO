<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú de Propuestas - Baby Shower</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #d1f0ff;
      display: flex;
      justify-content: center;
      height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 400px;
      background-color: #d1f0ff;
      position: relative;
      height: 100%;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .menu-title {
      font-size: 22px;
      font-weight: bold;
      font-style: italic;
      color: #1a365d;
      margin-bottom: 25px;
      text-align: center;
    }

    .proposals-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .proposal-btn {
      background-color: #ffffff;
      color: #1a365d;
      border: 2px solid #cbd5e0;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .proposal-btn:hover {
      border-color: #3182ce;
      background-color: #ebf8ff;
      transform: translateY(-2px);
    }

    /* Estilo especial para el botón que lleva a la propuesta actual */
    .proposal-btn.active-proposal {
      border-color: #3182ce;
      background-color: #3182ce;
      color: #ffffff;
    }

    .proposal-btn.active-proposal:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>

<body>
  <div id="app-container">
    <h1 class="menu-title">Selecciona una Propuesta</h1>

    <div class="proposals-container">
      <button class="proposal-btn" onclick="irAPropuestafinal()">
        Propuesta General
      </button>
      <button class="proposal-btn" onclick="irAPropuesta1()">
        Propuesta 1: Rumba77
      </button>
      <button class="proposal-btn" onclick="irAPropuesta2()">
        Propuesta 2: Rumba77
      </button>

      <button class="proposal-btn active-proposal" onclick="irAPropuestaActual()">
        Propuesta 3: Rumba77
      </button>

      <button class="proposal-btn" onclick="irAPropuesta4()">
        Propuesta 4: Rumba77
      </button>

      <button class="proposal-btn" onclick="irAPropuesta5()">
        Propuesta 5: Rumba77
      </button>

      <button class="proposal-btn" onclick="irAPropuesta6()">
        Propuesta 6: Rumba77
      </button>
    </div>
  </div>

  <script>
    function irAPropuesta1() {
      window.location.href = "propuesta1.html";
    }

    function irAPropuestaActual() {
      window.location.href = "propuesta3.html";
    }

    function irAPropuesta2() {
      window.location.href = "propuesta2.html";
    }

    function irAPropuesta4() {
      window.location.href = "propuesta4.html";
    }
    function irAPropuesta5() {
      window.location.href = "propuesta5.html";
    }
    function irAPropuesta6() {
      window.location.href = "propuesta6.html";
    }
    function irAPropuestafinal() {
      window.location.href = "propuestafinal.html";
    }
  </script>
</body>

</html>
